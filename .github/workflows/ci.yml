name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyQt6 PyQt6-Charts
      - run: python -m py_compile main.py
      - run: python -c "import json; json.load(open('config.json')); print('config.json OK')"
